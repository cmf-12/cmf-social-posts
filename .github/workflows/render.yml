name: Render posts
on:
  push:
    paths: ["posts/**", "templates/**", "scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - name: Render changed posts
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- posts/ | grep '\.json$' || true)
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(templates|scripts)/'; then CHANGED=""; ALL=1; fi
          if [ -n "$CHANGED" ]; then python scripts/render_v2.py $CHANGED; elif [ -n "$ALL" ]; then python scripts/render_v2.py; fi
      - name: Commit images
        run: |
          git config user.name "cmf-bot"
          git config user.email "cmf-bot@users.noreply.github.com"
          git add out/*.jpg 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Render post images [skip ci]" && git push)
