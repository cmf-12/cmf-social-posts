name: Fetch preview photos
on:
  push:
    paths: ["previews/photos.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        run: |
          mkdir -p previews/photos
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSL "$url" -o "previews/photos/$name"
          done < previews/photos.txt
          ls -la previews/photos
      - name: Commit
        run: |
          git config user.name "cmf-bot"
          git config user.email "cmf-bot@users.noreply.github.com"
          git add previews/photos
          git diff --cached --quiet || (git commit -m "Fetch preview photos [skip ci]" && git push)
