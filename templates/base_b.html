<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Playfair+Display:ital,wght@0,500;1,400;1,500&family=Montserrat:wght@300;400;500;600&family=Bebas+Neue&family=Josefin+Sans:wght@300;400&display=block" rel="stylesheet">
{{local_fonts}}
<style>
  :root{ --bg:#F5F0E8; --paper:#FBF8F2; --ink:#2F2A25; --gold:#B8975F; --line:#CDB88F; --muted:#6E655B; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{background:var(--bg);font-family:'Montserrat',Arial,sans-serif;color:var(--ink);position:relative}
  .abs{position:absolute}
  .ph{position:absolute;overflow:hidden;background:#fff}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph.contain img{object-fit:contain}
  .serif{font-family:'Cormorant Garamond',Georgia,serif}
  .play{font-family:'Playfair Display',Georgia,serif}
  .caps{text-transform:uppercase}
  .title{position:absolute;z-index:6;line-height:1}
  .foot{position:absolute;left:40px;right:40px;bottom:26px;text-align:center;z-index:7;
        font-family:'Cormorant Garamond',Georgia,serif;font-size:31px;font-weight:600;color:var(--ink);letter-spacing:.3px}
  .foot .pn{font-family:'Montserrat',sans-serif;font-size:19px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
  .foot.light{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55)}
  .foot.light .pn{color:#fff}
  svg.full{position:absolute;inset:0;width:1080px;height:1350px;z-index:5;pointer-events:none}
</style>
<style>{{layout_css}}</style>
</head>
<body>
{{body}}
</body>
</html>
