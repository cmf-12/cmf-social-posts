<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Poppins:wght@500;700;800&family=Pacifico&family=Bungee&family=DM+Serif+Display&display=block" rel="stylesheet">
{{local_fonts}}
<style>
  :root{ --bg: {{bg}}; --a: {{a}}; --b: {{b}}; --c: {{c}}; --ink: {{ink}}; --frame: {{frame}}; --soft: {{soft}}; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{background:var(--bg);font-family:'Poppins',Arial,sans-serif;position:relative}
  .abs{position:absolute}
  svg.full{position:absolute;inset:0;width:1080px;height:1350px}
  .photo{width:100%;height:100%;object-fit:{{fit}};display:block;background:#fff}
  .clip{overflow:hidden;position:absolute}
  .head{position:absolute;font-family:'Shrikhand',Georgia,serif;color:var(--ink);line-height:1.02;z-index:6;text-align:center}
  .cap{position:absolute;left:60px;right:60px;bottom:40px;text-align:center;font-size:29px;font-weight:500;color:var(--ink);z-index:6}
  .word{font-family:'Bungee','Poppins',sans-serif;text-transform:uppercase;line-height:.86;white-space:nowrap}
  .outline{color:transparent;-webkit-text-stroke:3px var(--a)}
</style>
<style>{{layout_css}}</style>
</head>
<body>
{{body}}
</body>
</html>
