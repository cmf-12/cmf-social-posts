<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Poppins:wght@500;700&family=DM+Serif+Display:ital@0;1&display=block" rel="stylesheet">
<style>
  :root{
    --bg: {{bg}}; --a: {{a}}; --b: {{b}}; --c: {{c}}; --ink: {{ink}}; --frame: {{frame}};
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{background:var(--bg);font-family:'Poppins',Arial,sans-serif;position:relative}
  .decor{position:absolute;inset:0;width:1080px;height:1350px}
  .headline{position:absolute;left:60px;right:60px;top:48px;text-align:center;
    font-family:{{headline_font}};font-size:{{headline_size}}px;line-height:1.02;color:var(--ink);
    letter-spacing:.5px;z-index:5}
  .caption{position:absolute;left:60px;right:60px;bottom:44px;text-align:center;
    font-size:30px;font-weight:500;color:var(--ink);z-index:5;letter-spacing:.3px}
  .caption b{font-weight:700}
  .stage{position:absolute;left:50%;top:{{stage_top}}px;transform:translateX(-50%);z-index:3}
  .photo{width:100%;height:100%;object-fit:{{fit}};display:block;background:#fff}

  /* circle */
  .circle .ring{width:930px;height:930px;border-radius:50%;background:var(--a);padding:26px;position:relative}
  .circle .ring::after{content:"";position:absolute;inset:-22px;border-radius:50%;border:8px dashed var(--b)}
  .circle .clip{width:100%;height:100%;border-radius:50%;overflow:hidden;border:10px solid var(--frame)}

  /* arch */
  .arch .shadow{position:absolute;left:28px;top:28px;width:860px;height:960px;border-radius:430px 430px 36px 36px;background:var(--a)}
  .arch .clip{position:relative;width:860px;height:960px;border-radius:430px 430px 36px 36px;overflow:hidden;border:12px solid var(--frame)}

  /* tilt */
  .tilt .back{position:absolute;inset:0;transform:rotate(5deg);background:var(--a);border-radius:28px}
  .tilt .card{position:relative;width:880px;height:960px;transform:rotate(-3deg);background:var(--frame);padding:22px;border-radius:24px;box-shadow:0 18px 40px rgba(0,0,0,.18)}
  .tilt .clip{width:100%;height:100%;overflow:hidden;border-radius:12px}

  /* offset */
  .offset .block{position:absolute;left:-30px;top:34px;width:880px;height:950px;background:var(--a);border-radius:60px}
  .offset .clip{position:relative;width:880px;height:950px;border-radius:60px;overflow:hidden;border:12px solid var(--frame)}

  .sticker{position:absolute;z-index:6;width:190px;height:190px;border-radius:50%;background:var(--b);color:var(--ink);
    display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:28px;line-height:1.05;
    transform:rotate(-12deg);box-shadow:0 6px 0 rgba(0,0,0,.12);padding:18px}
</style>
</head>
<body>
<svg class="decor" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="zebra" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="40" height="40" fill="var(--bg)"/><path d="M0 8 C10 2 18 14 40 6 L40 18 C22 26 12 12 0 20Z" fill="var(--ink)"/>
    </pattern>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="6" fill="var(--c)"/></pattern>
  </defs>
  {{decor}}
</svg>

<div class="headline">{{headline}}</div>

<div class="stage {{layout}}" style="width:{{stage_w}}px;height:{{stage_h}}px">
  {{frame_html}}
</div>

{{sticker_html}}

<div class="caption">{{caption}}</div>
</body>
</html>
